# Config for locoplaya666-final-financial-agent (API).
# In Railway: Service → Settings → Config file path → /railway.api.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.api"
watchPatterns = [
  "apps/api/**",
  "packages/shared/**",
  "scripts/despliegue/deploy-api.sh",
  "scripts/despliegue/lib/**",
  "scripts/qa/prod-smoke.mjs",
  "Dockerfile.api",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
  "railway.api.toml",
]

[deploy]
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
