name: Deploy API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "scripts/despliegue/deploy-api.sh"
      - "scripts/despliegue/sync-railway-production-vars.sh"
      - "scripts/despliegue/lib/**"
      - "scripts/qa/prod-smoke.mjs"
      - "scripts/qa/resend-approved-account-emails.ts"
      - "Dockerfile.api"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 6a535ffc-9224-4db3-b385-adf8f2bf0218
      RAILWAY_ENVIRONMENT_ID: 240cefd8-f924-4b76-a890-771db0a45a91
      RAILWAY_API_SERVICE_ID: 2d7f897f-3b0d-4a79-8ca1-ff760b7bcb53
      API_HEALTH_URL: https://locoplaya666-final-financial-agent-production.up.railway.app
      WEB_HEALTH_URL: https://financieramente.up.railway.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API
        run: bash scripts/despliegue/deploy-api.sh

      - name: Production smoke (API + stack readiness)
        run: node scripts/qa/prod-smoke.mjs
