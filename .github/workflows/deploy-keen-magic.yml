name: Deploy Web (keen-magic)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "scripts/despliegue/deploy-web.sh"
      - "scripts/despliegue/lib/**"
      - "scripts/qa/prod-smoke.mjs"
      - "Dockerfile.web"
      - ".dockerignore"
      - ".railwayignore"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy-keen-magic.yml"

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 6a535ffc-9224-4db3-b385-adf8f2bf0218
      RAILWAY_ENVIRONMENT_ID: 240cefd8-f924-4b76-a890-771db0a45a91
      RAILWAY_WEB_SERVICE_ID: 304ec087-4411-4ced-a42c-e00d451fcf4e
      WEB_URL: https://financieramente.up.railway.app
      API_HEALTH_URL: https://locoplaya666-final-financial-agent-production.up.railway.app
      WEB_HEALTH_URL: https://financieramente.up.railway.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy web
        run: bash scripts/despliegue/deploy-web.sh

      - name: Production smoke (web + API readiness)
        run: node scripts/qa/prod-smoke.mjs
